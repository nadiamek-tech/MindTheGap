<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mind the Gap 2 · Read the Formula</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Schibsted+Grotesk:wght@400;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="assets/course.css">
<style>
:root{--wk:#C0262D;--wk-soft:rgba(192,38,45,.09);--wk-d:#FF7A73;--wk-soft-d:rgba(255,122,115,.14);
  --c1:#C62828;--c2:#1F63B5;--c3:#1E7F4F;--c4:#6B3FA0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c1:#FF8A80;--c2:#7FB2FF;--c3:#6FD69B;--c4:#C3A1FF}}
:root[data-theme="dark"]{--c1:#FF8A80;--c2:#7FB2FF;--c3:#6FD69B;--c4:#C3A1FF}
.c1{color:var(--c1)}.c2{color:var(--c2)}.c3{color:var(--c3)}.c4{color:var(--c4)}

/* ---------- formula stage ---------- */
.story{display:grid;gap:12px}
.stg{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:22px 12px;min-height:150px;display:grid;align-content:center;gap:14px;overflow:hidden}
.m{font-family:"Source Serif 4",Georgia,serif;font-size:clamp(1.25rem,4.2vw,2.15rem);line-height:1.2;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.18em;font-variant-numeric:lining-nums}
.m .v{font-style:italic}
.m sub,.m sup{font-size:.6em;line-height:0;position:relative}
.m sub{vertical-align:baseline;top:.35em}.m sup{vertical-align:baseline;top:-.65em}
.tk{border-radius:6px;padding:0 .06em;transition:opacity .35s,background .35s,box-shadow .35s;display:inline-block;vertical-align:middle}
.xi,.sup{display:inline-block;white-space:nowrap}
.m .tk.supk{font-size:.6em;vertical-align:top;margin-left:-.05em}
.m.focus .tk:not(.hl):not(.lit):not(.anc){opacity:.28}
.tk.hl{background:color-mix(in srgb,var(--wk) 13%,transparent);box-shadow:0 0 0 2px var(--wk)}
.tk.hl .tk{background:none;box-shadow:none}
.frac{display:inline-flex;flex-direction:column;align-items:stretch;vertical-align:middle}
.frac>.num{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.12em;padding:0 .15em .12em;max-width:min(560px,78vw)}
.frac>.den{border-top:.07em solid currentColor;padding-top:.1em;display:flex;justify-content:center;align-items:center;gap:.12em}
.sig{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin-right:.05em}
.sig .S{font-size:1.45em;line-height:1}
.sig small{font-size:.48em;font-style:italic;line-height:1.1}
.xb{position:relative;display:inline-block}
.xb::before{content:"";position:absolute;left:.22em;right:-.04em;top:.1em;border-top:.065em solid currentColor}
.sqrt{display:inline-flex;align-items:stretch}
.sqrt .rad{border-top:.07em solid currentColor;padding:0 .1em;margin-top:.12em}
.new{animation:pop .6s ease both}
@keyframes pop{0%{opacity:0;transform:translateY(-.4em) scale(.9)}100%{opacity:1;transform:none}}
.melt{animation:melt 1.6s ease forwards;display:inline-flex}
@keyframes melt{0%{opacity:1;filter:none;transform:none}60%{opacity:.6;filter:blur(1px);transform:translateY(.15em) scaleY(.8)}100%{opacity:0;filter:blur(3px);transform:translateY(.5em) scaleY(.3);width:0;margin:0}}
.sep{position:relative;display:inline-block;min-width:.55em;text-align:center}
.sep .c{animation:fadeout .9s .5s ease forwards}
.sep .p{position:absolute;left:0;right:0;opacity:0;color:var(--c2);font-weight:600;animation:fadein .9s 1s ease forwards}
@keyframes fadeout{to{opacity:0;transform:translateY(.3em)}}
@keyframes fadein{to{opacity:1}}
.dchips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.dchip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;text-align:center;font-family:var(--f-display);min-width:54px;transition:all .3s}
.dchip b{display:block;font-size:1.15rem;font-variant-numeric:tabular-nums}
.dchip span{font-family:var(--f-mono);font-size:.68rem;color:var(--c1)}
.dchip.on{border-color:var(--c1);background:color-mix(in srgb,var(--c1) 9%,transparent)}
.order{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font-family:var(--f-display);font-size:.86rem}
.order span{border-radius:999px;padding:3px 10px;border:1px solid currentColor}
.stamp{justify-self:center;font-family:var(--f-display);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--good);border:3px solid var(--good);border-radius:10px;padding:6px 14px;transform:rotate(-4deg);animation:pop .5s ease both}
.talk{display:grid;gap:8px;min-height:92px;align-content:start}
.bub{font-family:var(--f-display);font-size:.98rem;line-height:1.45;padding:9px 13px;border-radius:14px;max-width:88%;animation:pop .45s ease both}
.bub small{display:block;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;opacity:.75;margin-bottom:1px}
.bub.t{background:var(--wk-soft);border:1px solid color-mix(in srgb,var(--wk) 35%,transparent);border-bottom-left-radius:4px;justify-self:start}
.bub.s{background:var(--sunk);border:1px solid var(--line);border-bottom-right-radius:4px;justify-self:end;text-align:right}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.dots{display:flex;gap:4px;flex:1 1 auto;justify-content:center;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);cursor:pointer}
.dots i.on{background:var(--wk)}
.dots i.done{background:color-mix(in srgb,var(--wk) 45%,var(--line))}

/* ---------- calculator ---------- */
.calcwrap{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:16px;align-items:start}
.calc{background:#232A33;border-radius:18px;padding:14px;box-shadow:0 2px 0 rgba(0,0,0,.25);max-width:280px;width:100%;justify-self:center}
.lcd{background:#C7D0BA;color:#1B2116;border-radius:8px;padding:8px 10px;font-family:var(--f-mono);min-height:74px;display:grid;align-content:space-between;margin-bottom:12px;box-shadow:inset 0 2px 4px rgba(0,0,0,.25)}
.lcd .in{font-size:.86rem;word-break:break-all;min-height:1.3em}
.lcd .out{font-size:1.45rem;text-align:right;font-weight:600}
.keys{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.keys button{border:0;border-radius:7px;padding:9px 0;font-family:var(--f-display);font-size:.9rem;font-weight:600;cursor:pointer;background:#3B4552;color:#EEF2F6;transition:transform .08s,background .15s}
.keys button.num{background:#E9ECEF;color:#1D232A}
.keys button.op{background:#56636F}
.keys button.eq{grid-column:span 2;background:#C0262D;color:#fff}
.keys button.ac{background:#B5651D;color:#fff}
.keys button.flash{transform:scale(.9);background:#FFD54A!important;color:#1D232A!important}
.keys button:disabled{cursor:default}
.side{display:grid;gap:10px;font-family:var(--f-display);font-size:.92rem}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 11px;cursor:pointer;font-family:var(--f-display);font-size:.84rem}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs button.trap{border-color:var(--bad);color:var(--bad)}
.tabs button.trap[aria-pressed="true"]{background:var(--bad);color:#fff}
.paper{border:1px dashed var(--line);border-radius:10px;padding:8px 12px;background:var(--bg);min-height:60px}
.paper div{font-family:var(--f-mono);font-size:.84rem;animation:pop .4s ease both}
.note{padding:9px 12px;border-radius:10px;background:var(--sunk);min-height:44px}
.note.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);border-left:3px solid var(--bad)}
.note.good{background:color-mix(in srgb,var(--good) 12%,transparent);border-left:3px solid var(--good)}

/* ---------- fill-in checker ---------- */
.fill{display:grid;gap:10px;font-family:var(--f-display);font-size:.95rem}
.fill .ln{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.fill .ln>b:first-child{min-width:72px;color:var(--wk);font-size:.8rem;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
input.blank{width:auto;min-width:56px;max-width:170px;border:0;border-bottom:2px solid var(--muted);border-radius:4px 4px 0 0;background:var(--sunk);color:var(--ink);padding:3px 6px;font:inherit;text-align:center}
input.blank.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
input.blank.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.ft{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ft th{background:var(--ink);color:var(--bg);font-weight:600;padding:6px;font-size:.85rem}
.ft td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:center}
.ft input.blank{min-width:48px;width:70px}
.datahead{font-family:var(--f-display);border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;margin-bottom:10px}
.datahead b{font-size:1.15rem;letter-spacing:.06em}

/* ---------- start / shock ---------- */
.routine{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:12px 0}
.routine div{border-top:3px solid var(--wk);background:var(--bg);border-radius:0 0 8px 8px;padding:6px 8px;font-family:var(--f-display);font-size:.8rem;color:var(--muted)}
.routine b{display:block;color:var(--ink);font-size:.86rem;letter-spacing:.04em}
.lv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:14px}
.lv div{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-family:var(--f-display);font-size:.8rem;background:var(--bg)}
.lv b{display:block;font-family:var(--f-mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase}
.timer{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;margin-top:12px}
.timer svg{width:96px;height:96px}
.cases{display:grid;gap:8px}
.jump{display:inline-block;margin-top:6px;font-weight:700}
@media (max-width:700px){
 .calcwrap{grid-template-columns:minmax(0,1fr)}
 .routine{grid-template-columns:repeat(2,minmax(0,1fr))}
 .lv{grid-template-columns:minmax(0,1fr)}
 .bub{max-width:96%}
 .stg{padding:18px 6px}
}
</style>
</head>
<body>
<script src="assets/course.js"></script>
<script>
const {W} = Lecture;
const esc = W.esc;

/* ================= formula-building helpers ================= */
const T=(k,html,cls='')=>`<span class="tk ${cls}" data-k="${k}">${html}</span>`;
const fr=(num,den)=>`<span class="frac"><span class="num">${num}</span><span class="den">${den}</span></span>`;
const SIG=(top='n',bot='i = 1')=>`<span class="sig"><small>${top}</small><span class="S">Σ</span><small>${bot}</small></span>`;
const XB='<span class="v xb">x</span>';
const XI='<span class="xi"><span class="v">x</span><sub>i</sub></span>';
const N='<span class="v">n</span>';
const MI='−';
const sep=(melt)=>melt?`<span class="sep"><span class="c">,</span><span class="p">+</span></span>`:`<span class="sep">,</span>`;
const plus='<span class="c2" style="font-weight:600">+</span>';
const list=(items,mode)=>items.map((v,i)=>v+(i<items.length-1?(mode==='melt'?' '+sep(true):mode==='plus'?' '+plus+' ':sep(false)):'')).join(' ');
function chips(vals,on=[]){ return `<div class="dchips">${vals.map((v,i)=>`<div class="dchip ${on.includes(i)?'on':''}"><span>x<sub>${i+1}</sub></span><b>${v}</b><span style="color:var(--muted)">i = ${i+1}</span></div>`).join('')}</div>`; }
const order=`<div class="order"><span class="c1">① subtract</span><span class="c4">② square</span><span class="c2">③ add (Σ)</span><span class="c3">④ divide</span></div>`;

/* ================= speech for the story player ================= */
const synth=window.speechSynthesis; let svoice=null;
function pickV(){ if(!synth) return; const vs=synth.getVoices(); svoice=vs.find(v=>/en-GB/.test(v.lang)&&/female|Serena|Kate|Libby|Sonia|Google UK English Female/i.test(v.name))||vs.find(v=>/^en/.test(v.lang))||null; }
if(synth){ pickV(); synth.addEventListener?synth.addEventListener('voiceschanged',pickV):0; }
const spoken=s=>s.replace(/<[^>]+>/g,'').replace(/x̄|x-bar/g,'x bar').replace(/Σ/g,'sigma').replace(/xᵢ/g,'x i').replace(/−/g,' minus ').replace(/s²/g,'s squared').replace(/σ²/g,'sigma squared').replace(/²/g,' squared').replace(/√/g,'square root of ').replace(/μ/g,'mu').replace(/÷/g,' divided by ').replace(/×/g,' times ');

/* ================= story stepper: the graphical storytelling engine =================
   stages: [{f: formula html, hl:[keys], x: extra html, say:[['t'|'s', text], ...]}] */
function story(el,{stages,label='Next step'}){
  el.innerHTML=`<div class="story"><div class="stg"><div class="m"></div><div class="xtra"></div></div>
   <div class="talk" aria-live="polite"></div>
   <div class="ctl"><button type="button" class="btn ghost" data-a="prev" aria-label="Previous step">←</button>
   <div class="dots"></div>
   <button type="button" class="btn" data-a="next">${label} →</button>
   <button type="button" class="btn ghost" data-a="play">▶ Play the story</button></div></div>`;
  const m=el.querySelector('.m'), xt=el.querySelector('.xtra'), talk=el.querySelector('.talk'), dots=el.querySelector('.dots');
  const bPrev=el.querySelector('[data-a=prev]'), bNext=el.querySelector('[data-a=next]'), bPlay=el.querySelector('[data-a=play]');
  let i=0, playing=false, run=0;
  stages.forEach((s,k)=>{ const d=document.createElement('i'); d.title='Step '+(k+1); d.addEventListener('click',()=>{stopPlay();show(k)}); dots.appendChild(d); });
  function show(k){
    i=k; const s=stages[k];
    m.innerHTML=s.f; xt.innerHTML=s.x||'';
    const hl=s.hl||[]; m.classList.toggle('focus',hl.length>0);
    hl.forEach(key=>m.querySelectorAll(`.tk[data-k="${key}"]`).forEach(t=>{ t.classList.add('hl'); t.querySelectorAll('.tk').forEach(c=>c.classList.add('lit')); let p=t.parentElement.closest('.tk'); while(p){ p.classList.add('anc'); p=p.parentElement.closest('.tk'); } }));
    talk.innerHTML=(s.say||[]).map(([w,txt],j)=>`<div class="bub ${w}" style="animation-delay:${playing?0:j*0.55}s"><small>${w==='t'?'Teacher':'Class'}</small>${txt}</div>`).join('');
    [...dots.children].forEach((d,j)=>{d.className=j===k?'on':j<k?'done':''});
    bPrev.disabled=k===0; bNext.disabled=k===stages.length-1;
  }
  function stopPlay(){ playing=false; run++; bPlay.textContent='▶ Play the story'; if(synth) synth.cancel(); }
  function play(){
    if(playing){ stopPlay(); return; }
    playing=true; const my=++run; bPlay.textContent='❚❚ Pause';
    if(i===stages.length-1) show(0);
    const step=()=>{ if(!playing||my!==run||!el.isConnected) return;
      const lines=(stages[i].say||[]).map(x=>x[1]);
      const after=()=>{ if(!playing||my!==run||!el.isConnected) return; if(i<stages.length-1){ show(i+1); setTimeout(step,500);} else stopPlay(); };
      sayAll(lines,my,after); };
    show(i); setTimeout(step,300);
  }
  function sayAll(lines,my,done){
    let j=0; const bubs=talk.querySelectorAll('.bub'); bubs.forEach(b=>b.style.opacity=.35);
    const nx=()=>{ if(!playing||my!==run) return; if(j>=lines.length){ setTimeout(done,700); return; }
      const b=bubs[j]; if(b) b.style.opacity=1; const txt=spoken(lines[j++]);
      if(synth){ const u=new SpeechSynthesisUtterance(txt); if(svoice) u.voice=svoice; u.rate=.95; u.onend=()=>setTimeout(nx,250); u.onerror=()=>setTimeout(nx,250); synth.speak(u); }
      else setTimeout(nx,900+txt.length*45); };
    if(synth) synth.cancel(); nx();
  }
  bPrev.addEventListener('click',()=>{stopPlay(); if(i>0) show(i-1)});
  bNext.addEventListener('click',()=>{stopPlay(); if(i<stages.length-1) show(i+1)});
  bPlay.addEventListener('click',play);
  show(0);
}

/* ================= calculator simulator (real evaluator, Casio-style precedence) ================= */
const K=s=>s.trim().split(/\s+/);
function calcEval(toks,ans){
  const t=[]; let num='';
  const flush=()=>{ if(num){ if(!/^\d*\.?\d+$|^\d+\.$/.test(num)) throw 'Syntax ERROR'; t.push(parseFloat(num)); num=''; } };
  for(const k of toks){ if(/^[0-9.]$/.test(k)){ num+=k; continue; } flush(); t.push(k); } flush();
  let p=0; const peek=()=>t[p], eat=()=>t[p++];
  function expr(){ let v=term(); while(peek()==='+'||peek()==='−'){ const o=eat(); const r=term(); v=o==='+'?v+r:v-r; } return v; }
  function term(){ let v=unary(); while(peek()==='×'||peek()==='÷'){ const o=eat(); const r=unary(); if(o==='÷'&&r===0) throw 'Math ERROR'; v=o==='×'?v*r:v/r; } return v; }
  function unary(){ if(peek()==='neg'||peek()==='−'){ eat(); return -unary(); } return post(); }
  function post(){ let v=prim(); while(peek()==='²'){ eat(); v=v*v; } return v; }
  function prim(){ const k=eat(); if(typeof k==='number') return k; if(k==='Ans') return ans;
    if(k==='('||k==='√('){ const v=expr(); if(peek()===')') eat(); if(k==='√('){ if(v<0) throw 'Math ERROR'; return Math.sqrt(v);} return v; }
    throw 'Syntax ERROR'; }
  if(!t.length) return 0;
  const v=expr(); if(p<t.length) throw 'Syntax ERROR'; return v;
}
const fmtN=v=>{ if(Math.abs(v)<1e-12) v=0; return String(+v.toPrecision(10)).replace('-','−'); };
const KEYS=[['(','('],[')',')'],['x²','²'],['√','√('],['AC','AC','ac'],
 ['7','7','num'],['8','8','num'],['9','9','num'],['DEL','DEL','ac'],['÷','÷','op'],
 ['4','4','num'],['5','5','num'],['6','6','num'],['×','×','op'],['−','−','op'],
 ['1','1','num'],['2','2','num'],['3','3','num'],['+','+','op'],['(−)','neg'],
 ['0','0','num'],['.','.','num'],['Ans','Ans'],['=','=','eq']];
const show1=k=>k==='neg'?'⁻':k==='Ans'?'Ans':k;
function calc(el,{scripts}){
  el.innerHTML=`<div class="calcwrap"><div class="calc" role="group" aria-label="Scientific calculator simulator">
    <div class="lcd"><div class="in"></div><div class="out">0</div></div>
    <div class="keys">${KEYS.map(([l,k,c])=>`<button type="button" class="${c||''}" data-k="${k}" aria-label="${l}">${l}</button>`).join('')}</div></div>
    <div class="side"><div class="tabs">${scripts.map((s,i)=>`<button type="button" class="${s.trap?'trap':''}" data-i="${i}" aria-pressed="false">${s.trap?'⚠ ':''}${s.name}</button>`).join('')}</div>
    <div class="note"></div>
    <div class="row"><button type="button" class="btn" data-a="go">Type the next step ▶</button><button type="button" class="btn ghost" data-a="reset">Start again</button></div>
    <div><span class="eyebrow">On your paper</span><div class="paper"></div></div>
    <p class="caption" style="margin:0">You can also press the keys yourself. The simulator follows the same order of operations as a typical scientific calculator: <b>x²</b> before the negative sign, then × ÷, then + −.</p></div></div>`;
  const inEl=el.querySelector('.lcd .in'), outEl=el.querySelector('.lcd .out'), note=el.querySelector('.note'), paper=el.querySelector('.paper');
  const go=el.querySelector('[data-a=go]');
  let toks=[], ans=0, just=false, cur=0, st=0, busy=false;
  const draw=()=>{ inEl.textContent=toks.map(show1).join(''); };
  function press(k){
    if(k==='AC'){ toks=[]; outEl.textContent='0'; just=false; draw(); return; }
    if(k==='DEL'){ if(just){ just=false; } toks.pop(); draw(); return; }
    if(k==='='){ try{ const v=calcEval(toks,ans); ans=v; outEl.textContent=fmtN(v);}catch(e){ outEl.textContent=typeof e==='string'?e:'Syntax ERROR'; } just=true; return; }
    if(just){ toks=['+','−','×','÷','²'].includes(k)?['Ans']:[]; just=false; }
    toks.push(k); draw();
  }
  el.querySelectorAll('.keys button').forEach(b=>b.addEventListener('click',()=>{ if(!busy) press(b.dataset.k); }));
  const flash=k=>{ const b=el.querySelector(`.keys button[data-k="${CSS.escape(k)}"]`); if(b){ b.classList.add('flash'); setTimeout(()=>b.classList.remove('flash'),170); } };
  function pick(i){ cur=i; st=0; el.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.i===i)); press('AC'); ans=0; paper.innerHTML=''; const s=scripts[i]; note.className='note'; note.innerHTML=s.intro; go.disabled=false; go.textContent='Type the next step ▶'; }
  function stepNext(){
    const s=scripts[cur]; if(busy||st>=s.steps.length) return; const step=s.steps[st++];
    busy=true; go.disabled=true; let j=0; const keys=K(step.k);
    const tick=()=>{ if(j<keys.length){ const k=keys[j++]; flash(k); press(k); setTimeout(tick,230); return; }
      busy=false; note.className='note'+(step.tone?' '+step.tone:''); note.innerHTML=step.note;
      if(step.rec) paper.insertAdjacentHTML('beforeend',`<div>${step.rec}</div>`);
      if(st>=s.steps.length){ go.textContent='Done ✓'; go.disabled=true; } else go.disabled=false; };
    tick();

function fill(el,{html,id}){
  let n=0;
  el.innerHTML=`<div class="fill">${html.replace(/\[\[([^\]]+)\]\]/g,(_,a)=>{ const num=/^-?[\d.]+$/.test(a.split('|')[0].replace('−','-')); return `<input class="blank" data-a="${esc(a)}" aria-label="blank ${++n}" ${num?'inputmode="decimal" size="5"':'size="12"'}>`; })}

   <div class="feedback" hidden></div></div>`;
  const ins=[...el.querySelectorAll('input.blank')], fb=el.querySelector('.feedback');
  const norm=s=>s.trim().toLowerCase().replace(/[−–]/g,'-').replace(/\s+/g,' ').replace(/^the /,'');
  const ok=(v,a)=>{ v=norm(v); if(!v) return false; return a.split('|').some(alt=>{ alt=norm(alt);
      const an=parseFloat(alt), vn=parseFloat(v.replace(/[^\d.\-]/g,''));

 {f:`E(<span class="v">X</span>) = 0 ${plus} 0.3 ${plus} 0.8 ${plus} 0.6 = <span class="new" style="font-weight:600">1.7</span>`,x:EXT(['x','p','xp']),say:[['t','Σ melts into plus signs, like always.'],['s','1.7.'],['t','Interpret: on average we expect 1.7 complaints per day. Notice: no dividing by n. The probabilities already do the averaging.']]},
 {f:`Var(<span class="v">X</span>) = <span class="c2">Σ</span>(<span class="v c1">x</span> <span class="c1">− μ</span>)<sup class="c4">2</sup> · <span class="c3">${PX}</span>`,x:EXT(['x','p','d','d2','w'],'w'),say:[['t','Variance of X: the same story as s². Subtract μ = 1.7, square, multiply by P(x), then add.'],['s','Σ = 0.81.'],['t','SD(X) = √0.81 = 0.9 complaints. Daily complaints typically vary by about 0.9 from 1.7.']]}];

  { nav:'Read the variance', title:'The big sister: read the sample variance', minutes:8, wide:true,

     'Read it from the <strong>inside out</strong>: ① subtract the mean, ② square, ③ add, ④ divide by n − 1.'],
    think:'Why must you know x̄ before you can even start the variance?',
    notes:['Same point-and-ask routine. Let students say “minus”, “square”, “divide” before each click.','Colours match the Formula Reading Guide: red = subtract, purple = square, blue = add, green = divide.'],

  { nav:'Build it, bracket by bracket', title:'Build it: one bracket for every value', minutes:8, wide:true,

     'Put each value in its bracket. The formula says “minus”: write it in every bracket. Then “x̄”: write 18 in every bracket. Then “square”: put the little 2 on every bracket.',

    think:'With a list of 6 values, how many brackets would you draw? What would the bottom of the fraction be?',
    notes:['Your classroom script: “How many values? Put that many brackets. What comes after xᵢ? Minus. Put it in all of them. What comes next? x̄. Do you have it? Put it. What next? Square.”','Expected think answer: 6 brackets; 6 − 1 = 5.'],
    fig:{label:'Sample variance · building', build:el=>story(el,{stages:BUILD_VAR})} },

     '<strong>Sanity checks:</strong> the column xᵢ − x̄ always adds up to 0; every squared value is positive or zero; and the variance can never be negative.'],
    think:'You get s² = −3.2. What went wrong?',

        {k:'( 1 5 − 1 8 ) ² =',note:'(15 − 18)² = (−3)² = <b>9</b>.',rec:'(15 − 18)² = 9'},
        {k:'( 1 8 − 1 8 ) ² =',note:'(18 − 18)² = <b>0</b>. A value equal to the mean adds no spread.',rec:'(18 − 18)² = 0'},
        {k:'( 2 0 − 1 8 ) ² =',note:'(20 − 18)² = 2² = <b>4</b>.',rec:'(20 − 18)² = 4'},

        {k:'3 6 + 9 + 0 + 4 + 4 9 =',note:'Σ melts: add the five squares. Σ(xᵢ − x̄)² = <b>98</b>. Keep it as Ans.',rec:'Σ = 36 + 9 + 0 + 4 + 49 = 98'},
        {k:'÷ ( 5 − 1 ) =',note:'98 ÷ (5 − 1) = 98 ÷ 4 = <b>24.5</b>. ✓ Units: marks².',tone:'good',rec:'s² = 98 / (5 − 1) = 24.5 marks²'}]},
      {name:'Trap: the lost minus',trap:true,intro:'Typing −6² straight in, without brackets.',steps:[
        {k:'− 6 ² =',note:'<b>−36?</b> The calculator squared 6 first, then added the minus. But (−6)² = +36: a square is never negative.',tone:'bad',rec:'✗ −6² = −36'},
        {k:'( − 6 ) ² =',note:'With brackets: (−6)² = <b>36</b>. ✓ Safest of all: type (12 − 18)² and let the calculator do the subtraction.',tone:'good',rec:'✓ (−6)² = 36'}]},
      {name:'Trap: n − 1 without brackets',trap:true,intro:'Dividing the total by n − 1 in one line.',steps:[

  { nav:'s, σ² and CV', title:'Same routine: standard deviation, population, CV', minutes:8, wide:true,
    narration:[
     'Every other formula on the midterm is read the same way: point at each symbol, say what it does, replace it with a number, then calculate.',
     '<strong>Standard deviation</strong>: s = √s². The square root undoes the squaring, so the answer comes back to the original units (marks, not marks²).',
     '<strong>Population variance</strong>: only two symbols change. μ replaces x̄, and you divide by N instead of n − 1. The question tells you which one: “a sample of”, “randomly selected” → sample; “all”, “every”, “the entire” → population.',
     '<strong>Coefficient of variation</strong>: CV = s ÷ x̄ × 100%. The spread as a percentage of the mean, with no units.'],

  { nav:'Expected value', title:'Probability tables: E(X) and Var(X)', minutes:8, wide:true,
    narration:[
     'A probability distribution lists every possible value x and its probability P(x). <strong>Check first</strong>: every P(x) is between 0 and 1, and all of them add up to 1.',
     '<strong>E(X) = Σ x · P(x)</strong>. Read it: each value times its probability, then add. In a table, that is one new column, x · P(x), and Σ melts into plus signs at the bottom.',
     'Do <strong>not</strong> divide by n. In the mean, every value has the same weight (1/n). In E(X), every value already has its own weight: P(x).',
     '<strong>Var(X)</strong> follows the same story as s²: subtract μ, square, multiply by P(x), add. SD(X) is its square root.'],
    think:'Why is there no “divide by n” in E(X)?',
    notes:['Level 2 coffee exercise (Booklet Exercises 6–7) follows below the stepper; give 3 minutes, or set it as homework.'],

  { nav:'Exit check', title:'Exit check', kind:'check', minutes:5,

     'Next workshop: the third gap, <strong>the calculator</strong>. Bring your own calculator to every workshop and to the midterm.'],
    notes:['Exit ticket answer: the differences from the mean always add up to 0, because positives and negatives cancel. Squaring makes every difference positive and gives more weight to values far from the mean.'],
