<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mind the Gap 2 · Read the Formula</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Schibsted+Grotesk:wght@400;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="assets/course.css">
<style>
:root{--wk:#C8102E;--wk-soft:rgba(200,16,46,.08);--wk-d:#FF7A7F;--wk-soft-d:rgba(255,122,127,.14);
  --c1:#C62828;--c2:#1F63B5;--c3:#1E7F4F;--c4:#6B3FA0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c1:#FF8A80;--c2:#7FB2FF;--c3:#6FD69B;--c4:#C3A1FF}}
:root[data-theme="dark"]{--c1:#FF8A80;--c2:#7FB2FF;--c3:#6FD69B;--c4:#C3A1FF}
.c1{color:var(--c1)}.c2{color:var(--c2)}.c3{color:var(--c3)}.c4{color:var(--c4)}
body{font-family:var(--f-display)}

/* ---------- shell ---------- */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:14px}
.logo{display:block;background:#fff;border-radius:8px;padding:4px 8px;line-height:0;flex:none}
.logo img{height:34px;width:auto}
.ttl{flex:1 1 auto;min-width:0}
.ttl b{display:block;font-weight:800;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl span{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stations{max-width:1180px;margin:0 auto;padding:0 16px 8px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
.stations button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-family:var(--f-display);font-size:.86rem;color:var(--muted);white-space:nowrap}
.stations button .n{font-family:var(--f-mono);font-size:.7rem;margin-right:5px}
.stations button[aria-current="true"]{background:var(--wk);border-color:var(--wk);color:#fff;font-weight:700}
.stations button.seen:not([aria-current="true"]){color:var(--ink)}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
.st-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px;margin-bottom:14px}
.st-head h1{font-size:clamp(1.7rem,4vw,2.6rem);font-weight:800;letter-spacing:-.02em}
.st-head .eyebrow{display:block;margin-bottom:4px}
.tracker{display:flex;gap:6px;flex-wrap:wrap}
.tracker div{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 9px;text-align:center;min-width:58px}
.tracker small{display:block;font-family:var(--f-mono);font-size:.62rem;color:var(--muted)}
.tracker b{font-size:.95rem;font-variant-numeric:tabular-nums}
.tracker div.got{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,transparent)}
.levels{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.levels button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 12px;cursor:pointer;font-family:var(--f-display);font-size:.9rem;display:flex;align-items:center;gap:7px}
.levels button small{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.levels button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.levels button[aria-pressed="true"] small{color:inherit;opacity:.7}
.inst{font-size:.95rem;color:var(--muted);margin:0 0 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.pager button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-family:var(--f-display);font-weight:600}
.pager button.nx{border-color:var(--wk);color:var(--wk);margin-left:auto}
.pager button:disabled{opacity:.3;cursor:default}

/* ---------- start ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center}
.hero h1{font-size:clamp(2.4rem,7vw,4.6rem);font-weight:800;letter-spacing:-.035em;line-height:.95}
.hero h1 span{color:var(--wk);display:block}
.team{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.team span{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:.88rem}
.route{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:14px 0}
.route div{border-top:3px solid var(--wk);background:var(--bg);border-radius:0 0 8px 8px;padding:7px 8px;font-weight:700;font-size:.82rem;letter-spacing:.04em;text-align:center}
.lv3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.lv3 div{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:.85rem;background:var(--bg)}
.lv3 b{display:block;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.08em;color:var(--wk)}
.go{margin-top:18px;font-size:1rem;padding:10px 18px}

/* ---------- formula stage ---------- */
.story{display:grid;gap:12px}
.stg{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:22px 10px;min-height:170px;display:grid;align-content:center;gap:14px;overflow:hidden}
.m{font-family:"Source Serif 4",Georgia,serif;font-size:clamp(1.25rem,4.2vw,2.2rem);line-height:1.2;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.18em;font-variant-numeric:lining-nums}
.m .v{font-style:italic}
.m sub,.m sup{font-size:.6em;line-height:0;position:relative}
.m sub{vertical-align:baseline;top:.35em}.m sup{vertical-align:baseline;top:-.65em}
.tk{border-radius:6px;padding:0 .06em;transition:opacity .35s,background .35s,box-shadow .35s;display:inline-block;vertical-align:middle}
.xi{display:inline-block;white-space:nowrap}
.m .tk.supk{font-size:.6em;vertical-align:top;margin-left:-.05em}
.m.focus .tk:not(.hl):not(.lit):not(.anc){opacity:.25}
.tk.hl{background:color-mix(in srgb,var(--wk) 13%,transparent);box-shadow:0 0 0 2px var(--wk);animation:pulse 1.4s ease 2}
.tk.hl .tk{background:none;box-shadow:none;animation:none}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--wk) 25%,transparent)}}
.frac{display:inline-flex;flex-direction:column;align-items:stretch;vertical-align:middle}
.frac>.num{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.12em;padding:0 .15em .12em;max-width:min(580px,80vw)}
.frac>.den{border-top:.07em solid currentColor;padding-top:.1em;display:flex;justify-content:center;align-items:center;gap:.12em}
.sig{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin-right:.05em}
.sig .S{font-size:1.45em;line-height:1}
.sig small{font-size:.48em;font-style:italic;line-height:1.1}
.xb{position:relative;display:inline-block}
.xb::before{content:"";position:absolute;left:.22em;right:-.04em;top:.1em;border-top:.065em solid currentColor}
.sqrt{display:inline-flex;align-items:stretch}
.sqrt .rad{border-top:.07em solid currentColor;padding:0 .1em;margin-top:.12em}
.new{animation:pop .6s ease both}
@keyframes pop{0%{opacity:0;transform:translateY(-.4em) scale(.85)}100%{opacity:1;transform:none}}
.melt{animation:melt 1.6s ease forwards;display:inline-flex}
@keyframes melt{0%{opacity:1}60%{opacity:.6;filter:blur(1px);transform:translateY(.15em) scaleY(.8)}100%{opacity:0;filter:blur(3px);transform:translateY(.5em) scaleY(.3);width:0;margin:0}}
.sep{position:relative;display:inline-block;min-width:.55em;text-align:center}
.sep .c{animation:fadeout .9s .5s ease forwards;display:inline-block}
.sep .p{position:absolute;left:0;right:0;opacity:0;color:var(--c2);font-weight:600;animation:fadein .9s 1s ease forwards}
@keyframes fadeout{to{opacity:0;transform:translateY(.3em)}}
@keyframes fadein{to{opacity:1}}
.dchips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.dchip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;text-align:center;min-width:54px}
.dchip b{display:block;font-size:1.15rem;font-variant-numeric:tabular-nums}
.dchip span{font-family:var(--f-mono);font-size:.68rem;color:var(--c1)}
.dchip.on{border-color:var(--c1);background:color-mix(in srgb,var(--c1) 9%,transparent);animation:pop .4s ease both}
.opt-q{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 18px;cursor:pointer;font:inherit;font-size:1.1rem;font-weight:700;min-width:64px}
.opt-q:hover:not(:disabled){border-color:var(--wk)}
.opt-q.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,transparent)}
.opt-q.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent);animation:shake .3s}
.qa input.blank{font-size:1.15rem;min-width:90px}
.order{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font-size:.86rem}
.order span{border-radius:999px;padding:3px 10px;border:1px solid currentColor}
.stamp{justify-self:center;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--good);border:3px solid var(--good);border-radius:10px;padding:6px 14px;transform:rotate(-4deg);animation:stamp .5s ease both}
@keyframes stamp{0%{opacity:0;transform:rotate(-4deg) scale(1.8)}100%{opacity:1;transform:rotate(-4deg) scale(1)}}
.talk{display:grid;gap:8px;min-height:84px;align-content:start}
.bub{font-size:1rem;line-height:1.4;padding:8px 13px;border-radius:14px;max-width:88%;animation:pop .45s ease both;cursor:pointer;position:relative}
.bub small{display:block;font-family:var(--f-mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-bottom:1px}
.bub.t{background:var(--wk-soft);border:1px solid color-mix(in srgb,var(--wk) 35%,transparent);border-bottom-left-radius:4px;justify-self:start}
.bub.s{background:var(--sunk);border:1px solid var(--line);border-bottom-right-radius:4px;justify-self:end;text-align:right}
.bub.now{box-shadow:0 0 0 2px var(--wk)}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.dots{display:flex;gap:4px;flex:1 1 auto;justify-content:center;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);cursor:pointer}
.dots i.on{background:var(--wk)}
.dots i.done{background:color-mix(in srgb,var(--wk) 45%,var(--line))}
.nl{width:100%;height:auto;display:block;max-width:640px;justify-self:center;touch-action:none}
.nl text{font-family:var(--f-display);fill:var(--ink)}
.nl .mut{fill:var(--muted)}
.pg circle{cursor:grab}.pg{touch-action:none}

/* ---------- calculator ---------- */
.calcwrap{display:grid;grid-template-columns:minmax(0,270px) minmax(0,1fr);gap:16px;align-items:start}
.calc{background:#232A33;border-radius:18px;padding:14px;max-width:280px;width:100%;justify-self:center}
.lcd{background:#C7D0BA;color:#1B2116;border-radius:8px;padding:8px 10px;font-family:var(--f-mono);min-height:74px;display:grid;align-content:space-between;margin-bottom:12px;box-shadow:inset 0 2px 4px rgba(0,0,0,.25)}
.lcd .in{font-size:.86rem;word-break:break-all;min-height:1.3em}
.lcd .out{font-size:1.45rem;text-align:right;font-weight:600}
.keys{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.keys button{border:0;border-radius:7px;padding:10px 0;font-family:var(--f-display);font-size:.9rem;font-weight:600;cursor:pointer;background:#3B4552;color:#EEF2F6;transition:transform .08s,background .15s}
.keys button.num{background:#E9ECEF;color:#1D232A}
.keys button.op{background:#56636F}
.keys button.eq{grid-column:span 2;background:#C8102E;color:#fff}
.keys button.ac{background:#B5651D;color:#fff}
.keys button.flash{transform:scale(.88);background:#FFD54A!important;color:#1D232A!important}
.side{display:grid;gap:10px;font-size:.92rem}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 11px;cursor:pointer;font-family:var(--f-display);font-size:.84rem}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs button.trap{border-color:var(--bad);color:var(--bad)}
.tabs button.trap[aria-pressed="true"]{background:var(--bad);color:#fff}
.paper{border:1px dashed var(--line);border-radius:10px;padding:8px 12px;background:var(--bg);min-height:50px}
.paper div{font-family:var(--f-mono);font-size:.84rem;animation:pop .4s ease both}
.note{padding:9px 12px;border-radius:10px;background:var(--sunk);min-height:42px}
.note.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);border-left:3px solid var(--bad)}
.note.good{background:color-mix(in srgb,var(--good) 12%,transparent);border-left:3px solid var(--good)}

/* ---------- fill ---------- */
.fill{display:grid;gap:10px;font-size:.98rem}
.fill .ln{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.fill .ln>b:first-child{min-width:70px;color:var(--wk);font-size:.76rem;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
input.blank{width:auto;min-width:56px;max-width:170px;border:0;border-bottom:2px solid var(--muted);border-radius:4px 4px 0 0;background:var(--sunk);color:var(--ink);padding:3px 6px;font:inherit;text-align:center}
input.blank.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
input.blank.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.ft{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ft th{background:var(--ink);color:var(--bg);font-weight:600;padding:6px;font-size:.85rem}
.ft td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:center}
.ft input.blank{min-width:44px;width:64px}
.datahead{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px}
.datahead b{font-size:1.2rem;letter-spacing:.06em}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stats div{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg);text-align:center}
.stats small{display:block;font-family:var(--f-mono);font-size:.64rem;color:var(--muted)}
.stats b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.timer{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;margin:14px 0}
.timer svg{width:92px;height:92px}
.reveal{margin-top:10px}
@media (max-width:760px){
 .hero,.two,.calcwrap{grid-template-columns:minmax(0,1fr)}
 .logo img{height:26px}
 .route{grid-template-columns:repeat(2,minmax(0,1fr))}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
 .bub{max-width:96%}
 .stg{padding:18px 6px}
 .card{padding:12px}
 .ttl span{display:none}
 .tracker div{min-width:44px;padding:2px 6px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="logo" href="index.html" title="Mind the Gap workshops"><img src="assets/cud-logo.png" alt="Canadian University Dubai"></a>
    <div class="ttl"><b>Mind the Gap · Read the formula</b><span>Workshop 2 · Midterm revision</span></div>
    <button type="button" class="pill" id="theme">◐</button>
  </div>
  <nav class="stations" id="stations" aria-label="Stations"></nav>
</header>
<main class="wrap" id="main"></main>

<script src="assets/course.js"></script>
<script>
const {W} = Lecture; const esc = W.esc;
document.getElementById('theme').addEventListener('click',()=>GED102Theme.toggle());

/* ================= results tracker ================= */
const RES_KEY='mtg2-res'; let RES={}; try{ RES=JSON.parse(localStorage.getItem(RES_KEY)||'{}') }catch(e){}
const TRACK=[['xbar','x̄'],['s2','s²'],['s','s'],['sig2','σ²'],['cv','CV'],['ex','E(X)']];
function setRes(o){ Object.assign(RES,o); try{ localStorage.setItem(RES_KEY,JSON.stringify(RES)) }catch(e){} document.querySelectorAll('.tracker').forEach(drawTracker); }
function drawTracker(el){ el.innerHTML=TRACK.map(([k,l])=>`<div class="${RES[k]?'got':''}"><small>${l}</small><b>${RES[k]||'?'}</b></div>`).join(''); }

/* ================= voice: recorded Kokoro clips, browser speech fallback ================= */
let AUD={}; fetch('audio/manifest.json').then(r=>r.ok?r.json():null).then(m=>{ if(m&&m.clips) AUD=m.clips; }).catch(()=>{});
const synth=window.speechSynthesis; let svoice=null, player=null;
function pickV(){ if(!synth) return; const vs=synth.getVoices(); svoice=vs.find(v=>/en-GB/.test(v.lang)&&/female|Serena|Kate|Libby|Sonia|Google UK English Female/i.test(v.name))||vs.find(v=>/^en/.test(v.lang))||null; }
if(synth){ pickV(); synth.onvoiceschanged=pickV; }
const plain=s=>s.replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();
const spoken=s=>plain(s).replace(/x̄/g,'x bar').replace(/Σ/g,'sigma').replace(/xᵢ/g,'x i').replace(/−/g,' minus ').replace(/s²/g,'s squared').replace(/σ²/g,'sigma squared').replace(/²/g,' squared').replace(/√/g,'square root of ').replace(/μ/g,'mu').replace(/÷/g,' divided by ').replace(/×/g,' times ').replace(/≈/g,'about ');
function hush(){ if(synth) synth.cancel(); if(player){ player.onended=null; player.pause(); player=null; } }
function say(who,html,done){
  hush(); const key=who+'|'+plain(html); const f=AUD[key];
  const fallback=()=>{ if(!synth){ setTimeout(done,900+plain(html).length*45); return; } const u=new SpeechSynthesisUtterance(spoken(html)); if(svoice) u.voice=svoice; u.rate=.95; if(who==='s') u.pitch=1.15; u.onend=()=>done&&done(); u.onerror=()=>done&&done(); synth.speak(u); };
  if(f){ player=new Audio('audio/'+f); player.onended=()=>{ player=null; done&&done(); }; player.play().catch(()=>{ player=null; fallback(); }); }
  else fallback();
}
window.__lines=new Set();

/* ================= formula helpers ================= */
const T=(k,html,cls='')=>`<span class="tk ${cls}" data-k="${k}">${html}</span>`;
const fr=(num,den)=>`<span class="frac"><span class="num">${num}</span><span class="den">${den}</span></span>`;
const SIG=(top='n',bot='i = 1')=>`<span class="sig"><small>${top}</small><span class="S">Σ</span><small>${bot}</small></span>`;
const SG=(c='')=>`<span class="sig ${c}"><small>n</small><span class="S">Σ</span><small>i = 1</small></span>`;
const XB='<span class="v xb">x</span>';
const XI='<span class="xi"><span class="v">x</span><sub>i</sub></span>';
const N='<span class="v">n</span>';
const S2='<span class="xi"><span class="v">s</span><sup>2</sup></span>';
const sep=m=>m?`<span class="sep"><span class="c">,</span><span class="p">+</span></span>`:`<span class="sep">,</span>`;
const plus='<span class="c2" style="font-weight:600">+</span>';
const list=(a,mode)=>a.map((v,i)=>v+(i<a.length-1?(mode==='melt'?' '+sep(true):mode==='plus'?' '+plus+' ':sep(false)):'')).join(' ');
const chips=(vals,on=[])=>`<div class="dchips">${vals.map((v,i)=>`<div class="dchip ${on.includes(i)?'on':''}"><span>x<sub>${i+1}</sub></span><b>${v}</b></div>`).join('')}</div>`;
const order=`<div class="order"><span class="c1">① subtract</span><span class="c4">② square</span><span class="c2">③ add</span><span class="c3">④ divide</span></div>`;
const big=v=>`<span class="new" style="font-weight:600">${v}</span>`;

/* ================= number line: the picture behind the formula ================= */
function nl(vals,{mean=null,mode='dots',lo=8,hi=30,div=null}={}){
  const Wd=600,pad=26,sc=(Wd-2*pad)/(hi-lo),X=v=>pad+(v-lo)*sc;
  const d=vals.map(v=>mean==null?0:v-mean);
  const side=(mode==='sq'||mode==='avg')?Math.max(...d.map(Math.abs),div?Math.sqrt(d.reduce((a,b)=>a+b*b,0)/div):0):0;
  const ay=Math.max(54,side*sc+40)+(mode==='dist'||mode==='bal'?vals.length*11:0), H=ay+(mode==='avg'?54:42);
  let g='';
  if(mode==='sq'||mode==='avg') vals.forEach((v,i)=>{ const s=Math.abs(d[i])*sc; if(!s) return; const x=Math.min(X(v),X(mean));
    g+=`<rect x="${x}" y="${ay-s}" width="${s}" height="${s}" fill="var(--c4)" fill-opacity="${mode==='avg'?.06:.14}" stroke="var(--c4)" stroke-width="1.5" ${mode==='avg'?'stroke-opacity=".35"':''} class="new"/>
     ${s>34&&mode==='sq'?`<text x="${x+s/2}" y="${ay-s/2+5}" text-anchor="middle" font-size="14" font-weight="700" style="fill:var(--c4)">${d[i]*d[i]}</text>`:''}`; });
  if(mode==='avg'&&div){ const v2=d.reduce((a,b)=>a+b*b,0)/div, s=Math.sqrt(v2)*sc;
    g+=`<rect x="${X(mean)-s/2}" y="${ay-s}" width="${s}" height="${s}" fill="var(--c3)" fill-opacity=".18" stroke="var(--c3)" stroke-width="3" class="new"/>
     <text x="${X(mean)}" y="${ay-s/2}" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--c3)">area ${+v2.toFixed(2)}</text>
     <line x1="${X(mean)-s/2}" x2="${X(mean)+s/2}" y1="${ay+28}" y2="${ay+28}" stroke="var(--c3)" stroke-width="3"/>
     <text x="${X(mean)}" y="${ay+46}" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--c3)">side = s ≈ ${+Math.sqrt(v2).toFixed(2)}</text>`; }
  if(mode==='dist'||mode==='bal') vals.forEach((v,i)=>{ if(!d[i]) return; const y=ay-16-i*11; const c=d[i]<0?'var(--c2)':'var(--c1)';
    g+=`<line x1="${X(mean)}" x2="${X(v)}" y1="${y}" y2="${y}" stroke="${c}" stroke-width="2.5" class="new"/><text x="${X(v)+(d[i]<0?-6:6)}" y="${y+4}" font-size="12" font-weight="700" text-anchor="${d[i]<0?'end':'start'}" style="fill:${c}">${d[i]>0?'+':'−'}${Math.abs(d[i])}</text>`; });
  for(let t=lo;t<=hi;t++){ const big=t%(hi-lo>24?5:2)===0; g+=`<line x1="${X(t)}" x2="${X(t)}" y1="${ay}" y2="${ay+(big?6:3)}" stroke="var(--muted)"/>${big?`<text x="${X(t)}" y="${ay+19}" text-anchor="middle" font-size="11" class="mut">${t}</text>`:''}`; }
  g=`<line x1="${pad-6}" x2="${Wd-pad+6}" y1="${ay}" y2="${ay}" stroke="var(--muted)" stroke-width="1.5"/>`+g;
  if(mean!=null){ g+=`<line x1="${X(mean)}" x2="${X(mean)}" y1="10" y2="${ay}" stroke="var(--c3)" stroke-width="2" stroke-dasharray="5 4"/><text x="${X(mean)+5}" y="20" font-size="13" font-weight="700" style="fill:var(--c3)">x̄ = ${+mean.toFixed(2)}</text>`;
    if(mode==='bal') g+=`<path d="M${X(mean)} ${ay+3} l-11 18 h22 z" fill="var(--c3)"/>`; }
  const stack={}; vals.forEach((v,i)=>{ const k=stack[v]=(stack[v]||0)+1; g+=`<circle cx="${X(v)}" cy="${ay-(k-1)*15}" r="${hi-lo>24?10:7}" fill="var(--c1)" data-i="${i}" style="cursor:${mode==='play'?'grab':'default'}"/>`; });
  return `<svg class="nl" viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Number line of the values">${g}</svg>`;
}

function story(el,stages){
  stages.forEach(s=>(s.say||[]).forEach(([w,t])=>window.__lines.add(w+'|'+plain(t))));
  el.innerHTML=`<div class="story"><div class="stg"><div class="m"></div><div class="xtra" style="display:grid"></div></div>
   <div class="talk" aria-live="polite"></div>
   <div class="ctl"><button type="button" class="btn ghost" data-a="prev" aria-label="Back">←</button><div class="dots"></div>
   <button type="button" class="btn" data-a="next">Next →</button><button type="button" class="btn ghost" data-a="play">▶ Play</button></div></div>`;
  const m=el.querySelector('.m'),xt=el.querySelector('.xtra'),talk=el.querySelector('.talk'),dots=el.querySelector('.dots');
  const bP=el.querySelector('[data-a=prev]'),bN=el.querySelector('[data-a=next]'),bPl=el.querySelector('[data-a=play]');
  let i=0,playing=false,run=0;
  stages.forEach((s,k)=>{ const d=document.createElement('i'); d.addEventListener('click',()=>{stop();show(k)}); dots.appendChild(d); });
  function show(k){ i=k; const s=stages[k]; m.innerHTML=s.f; xt.innerHTML=s.x||'';
    const hl=s.hl||[]; m.classList.toggle('focus',hl.length>0);
    hl.forEach(key=>m.querySelectorAll(`.tk[data-k="${key}"]`).forEach(t=>{ t.classList.add('hl'); t.querySelectorAll('.tk').forEach(c=>c.classList.add('lit')); let p=t.parentElement.closest('.tk'); while(p){ p.classList.add('anc'); p=p.parentElement.closest('.tk'); } }));
    talk.innerHTML=(s.say||[]).map(([w,t],j)=>`<div class="bub ${w}" style="animation-delay:${playing?0:j*.5}s" title="Click to hear"><small>${w==='t'?'Teacher':'Class'}</small>${t}</div>`).join('');
    talk.querySelectorAll('.bub').forEach((b,j)=>b.addEventListener('click',()=>{ stop(); const [w,t]=s.say[j]; b.classList.add('now'); say(w,t,()=>b.classList.remove('now')); }));
    [...dots.children].forEach((d,j)=>d.className=j===k?'on':j<k?'done':''); bP.disabled=k===0; bN.disabled=k===stages.length-1; }
  function stop(){ playing=false; run++; bPl.textContent='▶ Play'; hush(); }
  function play(){ if(playing){ stop(); return; } playing=true; const my=++run; bPl.textContent='❚❚ Pause'; if(i===stages.length-1) show(0); else show(i);
    const step=()=>{ if(!playing||my!==run||!el.isConnected) return; const lines=stages[i].say||[]; const bubs=talk.querySelectorAll('.bub'); bubs.forEach(b=>b.style.opacity=.35); let j=0;
      const nx=()=>{ if(!playing||my!==run||!el.isConnected) return; bubs.forEach(b=>b.classList.remove('now'));
        if(j>=lines.length){ setTimeout(()=>{ if(!playing||my!==run) return; if(i<stages.length-1){ show(i+1); setTimeout(step,450);} else stop(); },650); return; }
        const b=bubs[j]; if(b){ b.style.opacity=1; b.classList.add('now'); } const [w,t]=lines[j++]; say(w,t,()=>setTimeout(nx,200)); };
      nx(); };
    setTimeout(step,250); }
  bP.addEventListener('click',()=>{stop(); if(i>0) show(i-1)}); bN.addEventListener('click',()=>{stop(); if(i<stages.length-1) show(i+1)}); bPl.addEventListener('click',play);
  show(0);
}

/* ================= calculator (real evaluator, scientific-calculator precedence) ================= */
const K=s=>s.trim().split(/\s+/);
function calcEval(toks,ans){
  const t=[]; let num='';
  const flush=()=>{ if(num){ if(!/^\d*\.?\d+$|^\d+\.$/.test(num)) throw 'Syntax ERROR'; t.push(parseFloat(num)); num=''; } };
  for(const k of toks){ if(/^[0-9.]$/.test(k)){ num+=k; continue; } flush(); t.push(k); } flush();
  let p=0; const peek=()=>t[p], eat=()=>t[p++];
  function expr(){ let v=term(); while(peek()==='+'||peek()==='−'){ const o=eat(), r=term(); v=o==='+'?v+r:v-r; } return v; }
  function term(){ let v=unary(); while(peek()==='×'||peek()==='÷'){ const o=eat(), r=unary(); if(o==='÷'&&r===0) throw 'Math ERROR'; v=o==='×'?v*r:v/r; } return v; }
  function unary(){ if(peek()==='neg'||peek()==='−'){ eat(); return -unary(); } return post(); }
  function post(){ let v=prim(); while(peek()==='²'){ eat(); v=v*v; } return v; }
  function prim(){ const k=eat(); if(typeof k==='number') return k; if(k==='Ans') return ans;
    if(k==='('||k==='√('){ const v=expr(); if(peek()===')') eat(); if(k==='√('){ if(v<0) throw 'Math ERROR'; return Math.sqrt(v);} return v; } throw 'Syntax ERROR'; }
  if(!t.length) return 0; const v=expr(); if(p<t.length) throw 'Syntax ERROR'; return v;
}
const fmtN=v=>{ if(Math.abs(v)<1e-12) v=0; return String(+v.toPrecision(10)).replace('-','−'); };
const KEYS=[['(','('],[')',')'],['x²','²'],['√','√('],['AC','AC','ac'],['7','7','num'],['8','8','num'],['9','9','num'],['DEL','DEL','ac'],['÷','÷','op'],['4','4','num'],['5','5','num'],['6','6','num'],['×','×','op'],['−','−','op'],['1','1','num'],['2','2','num'],['3','3','num'],['+','+','op'],['(−)','neg'],['0','0','num'],['.','.','num'],['Ans','Ans'],['=','=','eq']];
const show1=k=>k==='neg'?'⁻':k;
function calc(el,scripts){
  el.innerHTML=`<div class="calcwrap"><div class="calc" role="group" aria-label="Calculator"><div class="lcd"><div class="in"></div><div class="out">0</div></div>
    <div class="keys">${KEYS.map(([l,k,c])=>`<button type="button" class="${c||''}" data-k="${k}" aria-label="${l}">${l}</button>`).join('')}</div></div>
    <div class="side"><div class="tabs">${scripts.map((s,i)=>`<button type="button" class="${s.trap?'trap':''}" data-i="${i}">${s.trap?'⚠ ':''}${s.name}</button>`).join('')}</div>
    <div class="note"></div><div class="row"><button type="button" class="btn" data-a="go">Type next ▶</button><button type="button" class="btn ghost" data-a="reset">↺</button></div>
    <div class="paper"></div></div></div>`;
  const inEl=el.querySelector('.in'),out=el.querySelector('.out'),note=el.querySelector('.note'),paper=el.querySelector('.paper'),go=el.querySelector('[data-a=go]');
  let toks=[],ans=0,just=false,cur=0,st=0,busy=false;
  const draw=()=>inEl.textContent=toks.map(show1).join('');
  function press(k){
    if(k==='AC'){ toks=[]; out.textContent='0'; just=false; draw(); return; }
    if(k==='DEL'){ just=false; toks.pop(); draw(); return; }
    if(k==='='){ try{ const v=calcEval(toks,ans); ans=v; out.textContent=fmtN(v);}catch(e){ out.textContent=typeof e==='string'?e:'Syntax ERROR'; } just=true; return; }
    if(just){ toks=['+','−','×','÷','²'].includes(k)?['Ans']:[]; just=false; } toks.push(k); draw(); }
  el.querySelectorAll('.keys button').forEach(b=>b.addEventListener('click',()=>{ if(!busy) press(b.dataset.k); }));
  const flash=k=>{ const b=el.querySelector(`.keys button[data-k="${CSS.escape(k)}"]`); if(b){ b.classList.add('flash'); setTimeout(()=>b.classList.remove('flash'),170); } };
  function pick(i){ cur=i; st=0; el.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.i===i)); press('AC'); ans=0; paper.innerHTML=''; note.className='note'; note.innerHTML=scripts[i].intro; go.disabled=false; go.textContent='Type next ▶'; }
  go.addEventListener('click',()=>{ const s=scripts[cur]; if(busy||st>=s.steps.length) return; const step=s.steps[st++]; busy=true; go.disabled=true; let j=0; const ks=K(step.k);
    const tick=()=>{ if(j<ks.length){ const k=ks[j++]; flash(k); press(k); setTimeout(tick,210); return; }
      busy=false; note.className='note'+(step.tone?' '+step.tone:''); note.innerHTML=step.note; if(step.rec) paper.insertAdjacentHTML('beforeend',`<div>${step.rec}</div>`);
      if(st>=s.steps.length){ go.textContent='Done ✓'; go.disabled=true; } else go.disabled=false; }; tick(); });
  el.querySelector('[data-a=reset]').addEventListener('click',()=>pick(cur));
  el.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>pick(+b.dataset.i)));
  pick(0);
}

/* ================= fill-in checker ================= */
function fill(el,html,onDone){
  let n=0;
  el.innerHTML=`<div class="fill">${html.replace(/\[\[([^\]]+)\]\]/g,(_,a)=>{ const num=/^-?[\d.]+$/.test(a.split('|')[0].replace('−','-')); return `<input class="blank" data-a="${esc(a)}" aria-label="blank ${++n}" ${num?'inputmode="decimal" size="5"':'size="11"'}>`; })}
   <div class="row"><button type="button" class="btn" data-a="chk">Check ✓</button><button type="button" class="btn ghost" data-a="show">Show answers</button></div><div class="feedback" hidden></div></div>`;
  const ins=[...el.querySelectorAll('input.blank')],fb=el.querySelector('.feedback');
  const norm=s=>s.trim().toLowerCase().replace(/[−–]/g,'-').replace(/\s+/g,' ').replace(/^the /,'');
  const ok=(v,a)=>{ v=norm(v); if(!v) return false; return a.split('|').some(alt=>{ alt=norm(alt); const an=parseFloat(alt),vn=parseFloat(v.replace(/[^\d.\-]/g,''));
      if(/^-?[\d.]+$/.test(alt)){ const dec=(alt.split('.')[1]||'').length; const tol=dec?Math.pow(10,-dec)*1.01:1e-9; return !isNaN(vn)&&Math.abs(vn-an)<=tol; }
      return v===alt||(v.length>2&&(v.includes(alt)||alt.includes(v))); }); };
  el.querySelector('[data-a=chk]').addEventListener('click',()=>{ let r=0; ins.forEach(i=>{ const g=ok(i.value,i.dataset.a); i.classList.toggle('ok',g); i.classList.toggle('no',!g&&i.value.trim()!==''); if(g) r++; });
    fb.hidden=false; fb.innerHTML=r===ins.length?'<b>All correct ✓</b>':`<b>${r} / ${ins.length}</b>`; if(r===ins.length&&onDone) onDone(); });
  el.querySelector('[data-a=show]').addEventListener('click',()=>{ ins.forEach(i=>{ i.value=i.dataset.a.split('|')[0]; i.classList.add('ok'); i.classList.remove('no'); }); fb.hidden=false; fb.innerHTML='Cover them and try again.'; });
}

    const v=Math.max(0,Math.min(30,Math.round((q.x-26)/((600-52)/30)))); if(v!==vals[drag]){ vals[drag]=v; draw(); } });

function quest(el,steps,onDone){

  const m=el.querySelector('.m'),xt=el.querySelector('.xtra'),talk=el.querySelector('.talk'),qa=el.querySelector('.qa'),dots=el.querySelector('.dots'),bN=el.querySelector('[data-a=next]');
  steps.forEach(()=>dots.appendChild(document.createElement('i')));
  let i=0;
  const norm=v=>v.trim().replace(/[−–]/g,'-').replace(',','.');
  function show(k){ i=k; const s=steps[k]; m.classList.remove('focus'); m.innerHTML=s.f; xt.innerHTML=s.x||''; bN.hidden=true;
    talk.innerHTML=`<div class="bub t" title="Click to hear"><small>Teacher</small>${s.q}</div>`;
    talk.querySelector('.bub').addEventListener('click',e=>{ const b=e.currentTarget; b.classList.add('now'); say('t',s.q,()=>b.classList.remove('now')); });
    if(s.o){ qa.innerHTML=`<div class="row">${s.o.map((o,j)=>`<button type="button" class="opt-q" data-j="${j}">${o}</button>`).join('')}</div>`;
      qa.querySelectorAll('.opt-q').forEach(b=>b.addEventListener('click',()=>{ if(+b.dataset.j===s.a){ b.classList.add('ok'); qa.querySelectorAll('.opt-q').forEach(x=>x.disabled=true); right(); } else { b.classList.add('no'); setTimeout(()=>b.classList.remove('no'),400); hint(); } })); }
    else { qa.innerHTML=`<div class="row"><input class="blank" inputmode="decimal" size="6" aria-label="answer"><button type="button" class="btn">Check</button></div>`;
      const inp=qa.querySelector('input'),b=qa.querySelector('button');
      const chk=()=>{ const v=parseFloat(norm(inp.value)); const tol=String(s.a).includes('.')?Math.pow(10,-(String(s.a).split('.')[1].length))*1.01:1e-9;
        if(!isNaN(v)&&Math.abs(v-s.a)<=tol){ inp.classList.add('ok'); inp.disabled=true; b.disabled=true; right(); } else { inp.classList.remove('no'); void inp.offsetWidth; inp.classList.add('no'); hint(); } };
      b.addEventListener('click',chk); inp.addEventListener('keydown',e=>{ if(e.key==='Enter') chk(); }); setTimeout(()=>inp.focus({preventScroll:true}),50); }
    [...dots.children].forEach((d,j)=>d.className=j===k?'on':j<k?'done':''); }
  function hint(){ if(steps[i].hint&&!talk.querySelector('.s')) talk.insertAdjacentHTML('beforeend',`<div class="bub s"><small>Hint</small>${steps[i].hint}</div>`); }
  function right(){ const s=steps[i]; if(s.then){ m.innerHTML=s.then; } if(s.tx!=null) xt.innerHTML=s.tx;
    if(i<steps.length-1) bN.hidden=false; else { xt.insertAdjacentHTML('beforeend','<div class="stamp">Well done ✓</div>'); onDone&&onDone(); } }
  bN.addEventListener('click',()=>show(i+1));
  show(0);
}

/* ================= router ================= */
const nav=document.getElementById('stations'),main=document.getElementById('main');
let seen=new Set(); try{ seen=new Set(JSON.parse(localStorage.getItem('mtg2-seen')||'[]')) }catch(e){}
STATIONS.forEach((s,i)=>{ const b=document.createElement('button'); b.type='button'; b.innerHTML=`<span class="n">${i}</span>${s.nav}`; b.addEventListener('click',()=>goSt(i)); nav.appendChild(b); });
let cur=-1;
function goSt(i,fromHash){ if(i<0||i>=STATIONS.length) return; hush(); cur=i; const s=STATIONS[i];
  main.innerHTML=(s.title?`<div class="st-head"><div><span class="eyebrow">Station ${i}</span><h1>${s.title}</h1></div>${s.track?'<div class="tracker"></div>':''}</div>`:'')+'<div id="body"></div>'+
   `<div class="pager"><button type="button" ${i===0?'disabled':''} onclick="goSt(${i-1})">←</button><button type="button" class="nx" ${i===STATIONS.length-1?'disabled':''} onclick="goSt(${i+1})">${i<STATIONS.length-1?STATIONS[i+1].nav+' →':''}</button></div>`;
  main.querySelectorAll('.tracker').forEach(drawTracker); s.build(main.querySelector('#body'));
  seen.add(i); try{ localStorage.setItem('mtg2-seen',JSON.stringify([...seen])) }catch(e){}
  [...nav.children].forEach((b,j)=>{ b.setAttribute('aria-current',j===i); b.classList.toggle('seen',seen.has(j)); });
  nav.children[i].scrollIntoView({block:'nearest',inline:'center'});
  if(!fromHash) try{ history.replaceState(null,'','#s'+i) }catch(e){} window.scrollTo({top:0}); }
addEventListener('hashchange',()=>{ const m=location.hash.match(/^#s(\d+)$/); if(m&&+m[1]!==cur) goSt(+m[1],true); });
addEventListener('keydown',e=>{ if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return; if(e.key==='ArrowRight') goSt(cur+1); if(e.key==='ArrowLeft') goSt(cur-1); });
const mh=location.hash.match(/^#s(\d+)$/); goSt(mh?Math.min(+mh[1],STATIONS.length-1):0,true);
window.__allLines=()=>{ [Q_MEAN,Q_VARB,Q_SD,Q_POP,Q_CV,Q_EX].forEach(q=>q.forEach(x=>window.__lines.add('t|'+plain(x.q)))); [MEAN,VAR,TBL,SD,POP,CV,EX].forEach(st=>st.forEach(s=>(s.say||[]).forEach(([w,t])=>window.__lines.add(w+'|'+plain(t))))); return [...window.__lines]; };
</script>
