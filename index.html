<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mind the Gap · Midterm Workshops</title>
<meta name="description" content="Mind the Gap: three midterm revision workshops for Introduction to Statistics, Canadian University Dubai.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Schibsted+Grotesk:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="assets/course.css">
<style>
:root{--wk:#C8102E;--wk-soft:rgba(200,16,46,.08);--wk-d:#FF7A7F;--wk-soft-d:rgba(255,122,127,.14)}
body{font-family:var(--f-display)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 56px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px;border-bottom:1px solid var(--line)}
.logo{background:#fff;border-radius:10px;padding:6px 10px;line-height:0}
.logo img{height:44px;width:auto}
.mast{padding-block:40px 28px}
.mast .eyebrow{display:block;margin-bottom:10px}
.mast h1{font-size:clamp(2.8rem,8vw,5.4rem);font-weight:800;letter-spacing:-.035em;line-height:.95}
.mast h1 span{color:var(--wk)}
.team{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.team span{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:.9rem}
.ws{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:18px;display:grid;gap:8px;align-content:start;text-decoration:none;color:var(--ink)}
.card .no{font-weight:800;font-size:2.6rem;line-height:1;color:var(--muted)}
.card h2{font-size:1.25rem}
.card.ready{border-color:var(--wk);background:linear-gradient(160deg,var(--wk-soft),transparent 70%)}
.card.ready .no,.card.ready .open{color:var(--wk);font-weight:700}
@media (max-width:760px){.ws{grid-template-columns:minmax(0,1fr)}.logo img{height:32px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="logo"><img src="assets/cud-logo.png" alt="Canadian University Dubai"></span><button type="button" class="pill" id="theme">◐</button></div>
  <section class="mast">
    <span class="eyebrow">Introduction to Statistics · Midterm revision</span>
    <h1>Mind the <span>Gap</span></h1>
    <div class="team"><span>Dr. Noura Mansoura</span><span>Eng. Nadia Mekhfi</span><span>Dr. Robert Mcclung</span><span>Junas Andrino</span></div>
  </section>
  <div class="ws">
    <div class="card"><span class="no">01</span><h2>Read the question</h2><span class="tag">Held</span></div>
    <a class="card ready" href="workshop-02.html"><span class="no">02</span><h2>Read the formula</h2><span class="open">Open →</span></a>
    <div class="card"><span class="no">03</span><h2>Use the calculator</h2><span class="tag">Coming soon</span></div>
  </div>
</div>
<script src="assets/course.js"></script>
<script>document.getElementById('theme').addEventListener('click',()=>GED102Theme.toggle());</script>
</body>
</html>
